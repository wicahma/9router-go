name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog step falls back to `git log $PREV_TAG..$TAG`; a shallow
          # clone has neither the tags nor the commits to answer it, which is why
          # the v1.9.3 body came out as a single line.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build Web SPA
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Build all platforms
        run: make cross

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            # A section headed for this exact tag, if one exists.
            NOTES=$(awk -v t="$TAG" '
              $0 ~ "^## \\[" t "\\]" || $0 ~ "^## \\[v" t "\\]" {flag=1; next}
              flag && /^## \[/ {flag=0}
              flag' CHANGELOG.md)
            # This changelog keeps everything under ## [Unreleased] and only
            # files it under a version when the tag is cut, so that section is
            # the real source. Without this the notes fall through to the
            # git-log fallback below, which lists bare commit subjects. The
            # entries are newest-first, so the body is the first subsection.
            if [ -z "$NOTES" ]; then
              NOTES=$(awk '
                /^## \[Unreleased\]/ {flag=1; next}
                flag && /^## \[/ {flag=0}
                flag && /^### / && seen {flag=0}
                flag && /^### / {seen=1}
                flag' CHANGELOG.md)
            fi
          fi
          if [ -n "$NOTES" ]; then
            echo "$NOTES" > /tmp/changelog.md
          else
            # Fallback to git log
            PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | head -2 | tail -1)
            if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF_NAME}" ]; then
              LOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
            else
              LOG=$(git log --pretty=format:"- %s (%h)" --no-merges ${PREV_TAG}..${GITHUB_REF_NAME})
            fi
            echo "$LOG" > /tmp/changelog.md
          fi
          cat /tmp/changelog.md

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            9router-go-linux-amd64
            9router-go-linux-arm64
            9router-go-darwin-amd64
            9router-go-darwin-arm64
            9router-go-windows-amd64.exe
            SHA256SUMS.txt
          body_path: /tmp/changelog.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
